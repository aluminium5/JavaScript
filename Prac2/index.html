<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Billing Calculator</title>
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
	<style>
		:root {
			--bg-1: #0f172a;
			--bg-2: #111827;
			--card: rgba(255, 255, 255, 0.95);
			--card-border: rgba(148, 163, 184, 0.28);
			--text: #0f172a;
			--muted: #475569;
			--accent: #0f766e;
			--accent-2: #f59e0b;
			--shadow: 0 20px 60px rgba(15, 23, 42, 0.28);
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			min-height: 100vh;
			font-family: "Inter", Arial, sans-serif;
			color: var(--text);
			background:
				radial-gradient(circle at top left, rgba(245, 158, 11, 0.26), transparent 30%),
				radial-gradient(circle at bottom right, rgba(15, 118, 110, 0.28), transparent 32%),
				linear-gradient(145deg, var(--bg-1), var(--bg-2));
			display: grid;
			place-items: center;
			padding: 24px;
		}

		.shell {
			width: min(1080px, 100%);
			display: grid;
			grid-template-columns: 1.05fr 0.95fr;
			gap: 24px;
			align-items: stretch;
		}

		.hero,
		.panel {
			background: var(--card);
			border: 1px solid var(--card-border);
			border-radius: 28px;
			box-shadow: var(--shadow);
			backdrop-filter: blur(14px);
		}

		.hero {
			padding: 40px;
			color: #e2e8f0;
			background:
				linear-gradient(160deg, rgba(15, 23, 42, 0.98), rgba(17, 24, 39, 0.92)),
				linear-gradient(145deg, rgba(15, 118, 110, 0.45), rgba(245, 158, 11, 0.22));
			display: flex;
			flex-direction: column;
			justify-content: space-between;
			min-height: 560px;
			overflow: hidden;
			position: relative;
		}

		.hero::after {
			content: "";
			position: absolute;
			inset: auto -80px -120px auto;
			width: 260px;
			height: 260px;
			border-radius: 50%;
			background: radial-gradient(circle, rgba(245, 158, 11, 0.28), transparent 70%);
			pointer-events: none;
		}

		.badge {
			display: inline-flex;
			align-items: center;
			gap: 8px;
			width: fit-content;
			padding: 8px 14px;
			border-radius: 999px;
			background: rgba(255, 255, 255, 0.08);
			color: #f8fafc;
			font-size: 0.82rem;
			font-weight: 700;
			letter-spacing: 0.08em;
			text-transform: uppercase;
			backdrop-filter: blur(8px);
		}

		.hero h1 {
			margin: 18px 0 10px;
			font-size: clamp(2.1rem, 4vw, 3.5rem);
			line-height: 1.04;
			max-width: 10ch;
		}

		.hero p {
			margin: 0;
			max-width: 52ch;
			color: rgba(226, 232, 240, 0.82);
			line-height: 1.75;
			font-size: 1rem;
		}

		.panel {
			padding: 30px;
		}

		.panel h2 {
			margin: 0 0 8px;
			font-size: 1.7rem;
		}

		.panel .subtitle {
			margin: 0 0 24px;
			color: var(--muted);
			line-height: 1.6;
		}

		form {
			display: grid;
			gap: 16px;
		}

		.field {
			display: grid;
			gap: 8px;
		}

		label {
			font-size: 0.92rem;
			font-weight: 700;
			color: #1e293b;
		}

		input {
			width: 100%;
			border: 1px solid #cbd5e1;
			border-radius: 14px;
			padding: 14px 16px;
			font: inherit;
			color: var(--text);
			background: #fff;
			outline: none;
			transition: border-color 0.2s ease, box-shadow 0.2s ease, transform 0.2s ease;
		}

		input:focus {
			border-color: rgba(15, 118, 110, 0.7);
			box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
			transform: translateY(-1px);
		}

		.actions {
			display: flex;
			gap: 12px;
			flex-wrap: wrap;
			margin-top: 4px;
		}

		.btn {
			border: 0;
			border-radius: 14px;
			padding: 14px 18px;
			font: inherit;
			font-weight: 700;
			cursor: pointer;
			transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
		}

		.btn:hover {
			transform: translateY(-2px);
			box-shadow: 0 12px 24px rgba(15, 23, 42, 0.14);
		}

		.btn-primary {
			background: linear-gradient(135deg, var(--accent), #115e59);
			color: #fff;
		}

		.btn-secondary {
			background: #e2e8f0;
			color: #0f172a;
		}

		.output {
			margin-top: 22px;
			padding: 20px;
			border-radius: 20px;
			background: linear-gradient(180deg, #f8fafc, #eef2f7);
			border: 1px solid #dbe4ee;
			min-height: 220px;
		}

		.output h2,
		.output h3,
		.output p {
			margin-top: 0;
		}

		.output h2 {
			margin-bottom: 14px;
			font-size: 1.25rem;
		}

		.output p {
			margin-bottom: 10px;
			color: #334155;
		}

		.identity-card {
			margin-top: 18px;
			padding: 16px 18px;
			border-radius: 18px;
			background: rgba(255, 255, 255, 0.08);
			border: 1px solid rgba(255, 255, 255, 0.12);
		}

		.identity-card strong {
			display: block;
			margin-bottom: 6px;
			color: #fff;
			font-size: 0.98rem;
		}

		.identity-card span {
			display: block;
			color: rgba(226, 232, 240, 0.8);
			line-height: 1.55;
		}

		.note {
			margin-top: 16px;
			font-size: 0.86rem;
			color: #64748b;
		}

		@media (max-width: 900px) {
			.shell {
				grid-template-columns: 1fr;
			}

			.hero {
				min-height: auto;
			}
		}

		@media (max-width: 640px) {
			body {
				padding: 14px;
			}

			.hero,
			.panel {
				padding: 22px;
				border-radius: 22px;
			}

			.stats {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main class="shell">
		<section class="hero" aria-label="Billing calculator introduction">
			<div>
				<span class="badge">Prac 2 | JavaScript Billing</span>
				<h1>Smart billing interface</h1>
				<div class="identity-card">
					<strong>Student Details</strong>
					<span>ATHARV LULEKAR</span>
					<span>PRN: 24070521036</span>
				</div>
			</div>
		</section>

		<section class="panel" aria-label="Billing form">
			<h2>Generate Bill</h2>
			<p class="subtitle">Fill in the form and press <strong>Calculate Bill</strong> to view the total amount with GST.</p>

			<form onsubmit="event.preventDefault(); calculateBill();">
				<div class="field">
					<label for="Name">Customer Name</label>
					<input id="Name" type="text" placeholder="Enter customer name" required>
				</div>

				<div class="field">
					<label for="product">Product</label>
					<input id="product" type="text" placeholder="Enter product name" required>
				</div>

				<div class="field">
					<label for="price">Price (₹)</label>
					<input id="price" type="number" min="0" step="0.01" placeholder="0.00" required>
				</div>

				<div class="field">
					<label for="quantity">Quantity</label>
					<input id="quantity" type="number" min="1" step="1" placeholder="1" required>
				</div>

				<div class="actions">
					<button class="btn btn-primary" type="submit">Calculate Bill</button>
					<button class="btn btn-secondary" type="reset">Clear Form</button>
				</div>
			</form>

			<section class="output" id="output" aria-live="polite">
				<h2>Billing Details</h2>
				<p>Your calculated bill will appear here.</p>
			</section>
		</section>
	</main>

	<script>
		function calculateBill(){
			var customerName = document.getElementById("Name").value;
			let product = document.getElementById("product").value;
			let price = Number(document.getElementById("price").value);
			let quantity = Number(document.getElementById("quantity").value);
			const GST = 0.18;

			let subtotal = price * quantity;
			let gstAmount = subtotal * GST;
			let total = subtotal + gstAmount;

			const bill = {
				customerName,
				product,
				subtotal,
				gstAmount,
				total
			};

			const { customerName: name, product: item, subtotal: sub, gstAmount: gst, total: finalAmount } = bill;

			document.getElementById("output").innerHTML = `
				<h2>Billing Details</h2>
				<p><b>Customer:</b> ${name}</p>
				<p><b>Product:</b> ${item}</p>
				<p><b>Subtotal:</b> ₹${sub}</p>
				<p><b>GST (18%):</b> ₹${gst.toFixed(2)}</p>
				<h3>Total Amount: ₹${finalAmount.toFixed(2)}</h3>
			`;

			console.log(`Customer: ${name}`);
			console.log(`Product: ${item}`);
			console.log(`Total Bill: ₹${finalAmount.toFixed(2)}`);
		}
	</script>
</body>
</html>

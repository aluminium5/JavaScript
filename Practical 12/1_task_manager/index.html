<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow Pro | Modern Task &amp; Ideas Dashboard | Atharv Lulekar (24070521036)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --card-border: rgba(255, 255, 255, 0.08);
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --accent: #10b981;
    --warn: #f43f5e;
    --txt: #f8fafc;
    --mut: #94a3b8;
    --input-bg: rgba(15, 23, 42, 0.7);
  }
  body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: radial-gradient(circle at 10% 10%, #1e1b4b 0%, #0f172a 60%), #0f172a;
    color: var(--txt);
    padding: 34px 18px 48px;
    min-height: 100vh;
  }

  .student-badge {
    position: fixed;
    top: 14px;
    right: 18px;
    z-index: 5;
    padding: 8px 12px;
    border: 1px solid rgba(52, 211, 153, 0.4);
    border-radius: 999px;
    background: rgba(15, 23, 42, 0.88);
    color: #d1fae5;
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .student-badge span {
    margin-left: 6px;
    color: #a5b4fc;
    font-weight: 500;
  }
  .app {
    max-width: 1060px;
    margin: auto;
    display: grid;
    grid-template-columns: 1.4fr 1fr;
    gap: 24px;
    align-items: start;
  }
  header {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--card-border);
  }
  header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 2.1rem;
    letter-spacing: -0.02em;
    font-weight: 700;
  }
  header h1 span {
    background: linear-gradient(135deg, #818cf8, #34d399);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  #clock {
    background: rgba(30, 41, 59, 0.8);
    border: 1px solid var(--card-border);
    color: #38bdf8;
    padding: 9px 18px;
    border-radius: 99px;
    font-family: 'Space Grotesk', monospace;
    font-size: 0.96rem;
    font-weight: 700;
    letter-spacing: 0.05em;
    box-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
  }
  h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.2rem;
    margin-bottom: 16px;
    color: #f1f5f9;
  }

  .add { display: flex; gap: 10px; margin-bottom: 18px; }
  .add input {
    flex: 1;
    padding: 13px 16px;
    border: 1.5px solid var(--card-border);
    border-radius: 12px;
    font: inherit;
    background: var(--input-bg);
    color: #fff;
    transition: all 0.2s ease;
  }
  .add input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
  }
  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    border-radius: 12px;
    padding: 11px 18px;
    font-weight: 700;
    transition: all 0.2s ease;
  }
  .pri {
    background: linear-gradient(135deg, var(--primary), #4f46e5);
    color: #fff;
    box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
  }
  .pri:hover {
    filter: brightness(1.12);
    transform: translateY(-1px);
  }

  /* Stats summary pills */
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .stat {
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 12px 10px;
    text-align: center;
  }
  .stat b {
    display: block;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 1.65rem;
    color: #818cf8;
  }
  .stat small { color: var(--mut); font-size: 0.76rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }

  /* Modern progress bar */
  .bar {
    height: 8px;
    background: rgba(15, 23, 42, 0.8);
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 18px;
    border: 1px solid var(--card-border);
  }
  .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, #6366f1, #10b981);
    transition: width 0.4s cubic-bezier(0.16, 1, 0.3, 1);
  }

  /* Filters */
  .filters { display: flex; gap: 8px; margin-bottom: 16px; }
  .filters button {
    background: rgba(15, 23, 42, 0.5);
    border: 1px solid var(--card-border);
    color: var(--mut);
    padding: 7px 16px;
    border-radius: 99px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .filters button.on {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
  }

  /* Task List */
  ul { list-style: none; display: grid; gap: 10px; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    background: rgba(15, 23, 42, 0.6);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    transition: all 0.2s ease;
  }
  li:hover {
    border-color: rgba(99, 102, 241, 0.35);
    background: rgba(15, 23, 42, 0.85);
  }
  li .txt { flex: 1; word-break: break-word; font-size: 0.94rem; }
  li.done { opacity: 0.55; }
  li.done .txt { text-decoration: line-through; color: var(--mut); }
  li input[type=checkbox] {
    width: 20px;
    height: 20px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  li .x {
    background: transparent;
    color: var(--mut);
    font-size: 1.3rem;
    padding: 2px 8px;
    border-radius: 6px;
  }
  li .x:hover { color: var(--warn); background: rgba(244, 63, 94, 0.1); }
  li small { color: var(--mut); font-size: 0.72rem; }
  .empty { text-align: center; color: var(--mut); padding: 26px; font-size: 0.9rem; }
  .clear {
    margin-top: 16px;
    background: transparent;
    color: var(--warn);
    font-size: 0.84rem;
    border: 1px solid rgba(244, 63, 94, 0.25);
    padding: 8px 16px;
    border-radius: 10px;
  }
  .clear:hover { background: rgba(244, 63, 94, 0.12); }

  /* AJAX section */
  .posts { display: grid; gap: 10px; margin-top: 14px; }
  .post {
    padding: 14px;
    background: rgba(15, 23, 42, 0.5);
    border-left: 4px solid var(--accent);
    border-radius: 10px;
    font-size: 0.88rem;
    border-top: 1px solid var(--card-border);
    border-right: 1px solid var(--card-border);
    border-bottom: 1px solid var(--card-border);
    transition: transform 0.2s, background 0.2s;
  }
  .post:hover {
    transform: translateX(3px);
    background: rgba(15, 23, 42, 0.8);
  }
  .post b { display: block; text-transform: capitalize; margin-bottom: 4px; color: #38bdf8; }
  .status { font-size: 0.82rem; color: #34d399; margin-top: 10px; font-weight: 600; }

  @media (max-width: 820px) { .app { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="student-badge">Atharv Lulekar <span>PRN: 24070521036</span></div>
<div class="app">
  <header>
    <h1>Task<span>Flow</span> Pro</h1>
    <div id="clock">--:--:--</div>
  </header>

  <section class="card">
    <h2>Active Tasks &amp; Schedule</h2>
    <div class="add">
      <input id="taskInput" placeholder="What task needs to be tackled next?">
      <button class="pri" id="addBtn">+ Add</button>
    </div>
    <div class="stats">
      <div class="stat"><b id="sTotal">0</b><small>Total</small></div>
      <div class="stat"><b id="sDone">0</b><small>Completed</small></div>
      <div class="stat"><b id="sLeft">0</b><small>Pending</small></div>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="filters">
      <button data-f="all" class="on">All</button>
      <button data-f="pending">Pending</button>
      <button data-f="done">Done</button>
    </div>
    <ul id="list"></ul>
    <button class="clear" id="clearDone">Clear Finished Tasks</button>
  </section>

  <section class="card">
    <h2>Web Idea Generator (AJAX)</h2>
    <p style="font-size:.85rem;color:var(--mut)">Fetch sample ideas with jQuery $.getJSON and click to add them directly into your tasks.</p>
    <button class="pri" id="loadBtn" style="margin-top:14px">Fetch Sample Ideas</button>
    <div class="status" id="status"></div>
    <div class="posts" id="posts"></div>
  </section>
</div>

<script>
$(function () {
  let tasks = JSON.parse(localStorage.getItem('donezo-tasks')) || [];
  let filter = 'all';

  const save = () => localStorage.setItem('donezo-tasks', JSON.stringify(tasks));
  const esc = (s) => $('<div>').text(s).html();

  // live clock with setInterval
  setInterval(() => $('#clock').text(new Date().toLocaleTimeString('en-IN')), 1000);
  $('#clock').text(new Date().toLocaleTimeString('en-IN'));

  function render() {
    const shown = tasks.filter(t => filter === 'all' || (filter === 'done' ? t.done : !t.done));
    const $ul = $('#list').empty();
    if (!shown.length) $ul.append('<li class="empty" style="display:block">Nothing here yet. Add a new task above!</li>');
    shown.forEach(t => {
      $ul.append(`<li class="${t.done ? 'done' : ''}" data-id="${t.id}">
        <input type="checkbox" ${t.done ? 'checked' : ''}>
        <div class="txt">${esc(t.text)}<br><small>${t.time}</small></div>
        <button class="x" title="Delete">&times;</button></li>`);
    });
    const done = tasks.filter(t => t.done).length;
    $('#sTotal').text(tasks.length); $('#sDone').text(done); $('#sLeft').text(tasks.length - done);
    $('#barFill').css('width', tasks.length ? (done / tasks.length * 100) + '%' : '0%');
  }

  function add(text) {
    text = $.trim(text);
    if (!text) return;
    tasks.unshift({ id: Date.now() + Math.random(), text, done: false, time: new Date().toLocaleString('en-IN') });
    save(); render();
  }

  $('#addBtn').on('click', () => { add($('#taskInput').val()); $('#taskInput').val('').focus(); });
  $('#taskInput').on('keypress', (e) => { if (e.which === 13) $('#addBtn').click(); });

  $('#list').on('change', 'input[type=checkbox]', function () {
    const id = $(this).closest('li').data('id');
    const t = tasks.find(x => x.id == id); t.done = this.checked; save(); render();
  });
  $('#list').on('click', '.x', function () {
    const id = $(this).closest('li').data('id');
    $(this).closest('li').slideUp(180, () => { tasks = tasks.filter(x => x.id != id); save(); render(); });
  });
  $('.filters').on('click', 'button', function () {
    $('.filters button').removeClass('on'); $(this).addClass('on'); filter = $(this).data('f'); render();
  });
  $('#clearDone').on('click', () => { tasks = tasks.filter(t => !t.done); save(); render(); });

  // AJAX
  $('#loadBtn').on('click', function () {
    $('#status').text('Loading...');
    $.getJSON('https://jsonplaceholder.typicode.com/posts?_limit=4')
      .done((data) => {
        $('#status').text('Loaded ' + data.length + ' ideas. Click one to add as a task.');
        $('#posts').html(data.map(p => `<div class="post" data-t="${esc(p.title)}" style="cursor:pointer"><b>${esc(p.title)}</b>${esc(p.body.slice(0, 70))}...</div>`).join(''));
      })
      .fail(() => $('#status').text('Could not load (check internet connection).'));
  });
  $('#posts').on('click', '.post', function () { add($(this).data('t')); $(this).fadeOut(200); });

  render();
});
</script>
</body>
</html>
